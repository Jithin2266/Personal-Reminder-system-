services:
  - type: web
    name: reminder-pro-api
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        value: "file:/var/data/prod.db"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
